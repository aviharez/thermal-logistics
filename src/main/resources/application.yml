server:
  port: 8080

spring:
  application:
    name: thermal-logistics
  datasource:
    url: jdbc:h2:mem:thermaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

weather:
  api:
    key: ${WEATHER_API_KEY:demo-key}
    base-url: https://api.openweathermap.org/data/2.5
    connect-timeout: 500
    read-timeout: 10000

thermal:
  safety-buffer-hours: 0.5
  setup-time:
    small-sculpture-liters: 50
    medium-sculpture-liters: 200
    small-setup-minutes: 30
    medium-setup-minutes: 60
    large-setup-minutes: 90
    xlarge-setup-minutes: 120

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.project: DEBUG
    org.springframework.web: INFO